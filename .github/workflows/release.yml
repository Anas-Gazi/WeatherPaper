name: Build & Release WeatherPaper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Package (.deb & .tar.gz)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential \
            libcurl4-openssl-dev libssl-dev libayatana-appindicator3-dev \
            qt6-base-dev libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DWEATHERPAPER_BUILD_SETTINGS_UI=ON \
            -DWEATHERPAPER_BUILD_TRAY_UI=ON \
            -DWEATHERPAPER_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-release -j$(nproc)

      - name: Run Tests
        run: ctest --test-dir build-release --output-on-failure

      - name: Strip Binary
        run: strip build-release/src/app/weatherpaperd

      - name: Package .deb and .tar.gz via CPack
        run: |
          cd build-release
          cpack -G DEB
          cpack -G TGZ

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build-release/*.deb
            build-release/*.tar.gz

  build-windows:
    name: Build Windows 10/11 Installer (.exe & .zip)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Configure CMake
        run: |
          cmake -S . -B build-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DWEATHERPAPER_BUILD_SETTINGS_UI=ON `
            -DWEATHERPAPER_BUILD_TRAY_UI=ON `
            -DWEATHERPAPER_BUILD_TESTS=OFF

      - name: Build Release
        run: cmake --build build-windows --config Release --parallel

      - name: Deploy Qt DLLs (windeployqt)
        run: |
          windeployqt --release --no-translations build-windows/src/app/Release/weatherpaperd.exe

      - name: Build Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/weatherpaper.iss

      - name: Create Portable Zip
        run: |
          cmake --install build-windows --prefix build-windows/dist-portable
          Compress-Archive -Path build-windows/dist-portable/* -DestinationPath dist/WeatherPaper-Windows-Portable.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            linux-packages/*.deb
            linux-packages/*.tar.gz
            windows-packages/*
          draft: false
          prerelease: false
          generate_release_notes: true
