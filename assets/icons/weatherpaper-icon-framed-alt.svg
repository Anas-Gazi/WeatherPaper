<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Sun accent, peeking from behind the cloud -->
  <circle cx="16" cy="10.2" r="2.9" fill="#F0A94E"/>

  <!-- Cloud (weather motif), built from overlapping flat shapes -->
  <circle cx="16"   cy="15.5" r="4.6" fill="#1E6FE0"/>
  <circle cx="12"   cy="18"   r="3.4" fill="#1E6FE0"/>
  <circle cx="20"   cy="18"   r="3.4" fill="#1E6FE0"/>
  <rect x="9.5" y="17.7" width="13" height="5" rx="2.5" fill="#1E6FE0"/>

  <!-- Wallpaper / screen frame -->
  <rect x="3" y="5" width="26" height="22" rx="5.2"
        fill="none" stroke="#1E6FE0" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
